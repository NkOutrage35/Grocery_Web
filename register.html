<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/register.css" />
  </head>
  <body>
    <div class="registration-container">
      <h2>Register</h2>
      <form id="registrationForm">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" />
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="text" id="email" name="email" placeholder="grocify@example.com" />
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone" placeholder="1234567890" />
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="xxxxx" />
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password:</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="xxxxx" />
          <div class="error-message"></div>
        </div>

        <div class="form-group">
          <label for="address">Address:</label>
          <input type="text" id="address" name="address" placeholder="Enter your address" />
          <div class="error-message"></div>
        </div>

        <button type="submit" formaction="registered.html">Register</button>
      </form>
    </div>

    <script>
      const form = document.getElementById("registrationForm");
      const username = form.querySelector("#username");
      const email = form.querySelector("#email");
      const password = form.querySelector("#password");
      const confirmPassword = form.querySelector("#confirmPassword");
      const phone = form.querySelector("#phone");
      const address = form.querySelector("#address");

      const setError = (element, message) => {
        const inputControl = element.parentElement;
        const errorDisplay = inputControl.querySelector(".error-message");

        errorDisplay.innerText = message;
        inputControl.classList.add("error");
        inputControl.classList.remove("success");
      };

      const setSuccess = (element) => {
        const inputControl = element.parentElement;
        const errorDisplay = inputControl.querySelector(".error-message");

        errorDisplay.innerText = "";
        inputControl.classList.add("success");
        inputControl.classList.remove("error");
      };

      const isValidEmail = (email) => {
        const regex =
          /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
        return regex.test(String(email).toLowerCase());
      };

      phone.addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/\D/g, ""); 
      });

      const validateInput = () => {
        let isValid = true; 

        const usernameValue = username.value.trim();
        const emailValue = email.value.trim();
        const phoneValue = phone.value.trim();
        const passwordValue = password.value.trim();
        const confirmPasswordValue = confirmPassword.value.trim();
        const addressValue = address.value.trim();

        if (usernameValue === "") {
          setError(username, "Username is required");
          isValid = false; 
        } else {
          setSuccess(username);
        }

        if (emailValue === "") {
          setError(email, "Email is required");
          isValid = false; 
        } else if (!isValidEmail(emailValue)) {
          setError(email, "Email is not valid");
          isValid = false; 
        } else {
          setSuccess(email);
        }

        if (phoneValue === "") {
          setError(phone, "Phone number is required use 10 digits");
          isValid = false; 
        } else if (!/^\d{10}$/.test(phoneValue)) {
          setError(phone, "Phone number must be 10 digits");
          isValid = false; 
        } else {
          setSuccess(phone);
        }

        let isPasswordValid = true;
        if (passwordValue === "") {
          setError(password, "Password is required");
          isValid = false; 
          isPasswordValid = false;
        } else if (passwordValue.length < 6) {
          setError(password, "Password must be at least 6 characters");
          isValid = false; 
          isPasswordValid = false;
        } else {
          setSuccess(password);
        }

        if (confirmPasswordValue === "") {
          setError(confirmPassword, "Confirm Password");
          isValid = false; 
        } else if (!isPasswordValid) {
          setError(confirmPassword, "Fix the Password field first.");
        } else if (confirmPasswordValue !== passwordValue) {
          setError(confirmPassword, "Passwords do not match");
          isValid = false; 
        } else {
          setSuccess(confirmPassword);
        }

        if (addressValue === "") {
          setError(address, "Address is required");
          isValid = false; 
        } else {
          setSuccess(address);
        }

        return isValid;
      };

      form.addEventListener("submit", (e) => {
        const isFormValid = validateInput();

        if (!isFormValid) {
          e.preventDefault();
        } else {
          console.log("Form is valid and ready to submit!");
        }
      });
    </script>
  </body>
</html>
